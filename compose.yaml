services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: ledgerwake
      POSTGRES_USER: ledgerwake
      POSTGRES_PASSWORD: ledgerwake-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerwake -d ledgerwake"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - ledgerwake-postgres:/var/lib/postgresql/data

volumes:
  ledgerwake-postgres:
