name: Bug report
description: Report reproducible incorrect behavior
body:
  - type: markdown
    attributes:
      value: Do not disclose vulnerabilities or secrets here; follow SECURITY.md.
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What happened and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction, description: Minimal safe steps and sanitized logs }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Ledgerwake version }
    validations: { required: true }
  - type: textarea
    id: environment
    attributes: { label: Environment, description: Node, PostgreSQL, OS, and network without credentials }
    validations: { required: true }
