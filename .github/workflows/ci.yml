name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: ledgerwake
          POSTGRES_USER: ledgerwake
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerwake -d ledgerwake"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://ledgerwake:test-only@127.0.0.1:5432/ledgerwake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1e60f620b9541d8ab1ee00c4eaddb8c6acb745a # v4.0.4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm audit --audit-level=high
