name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 2"
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@b374143c1149a9118a5efb5e8a2869f06f28a1d6 # v3.28.10
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@b374143c1149a9118a5efb5e8a2869f06f28a1d6 # v3.28.10
